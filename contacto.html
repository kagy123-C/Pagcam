<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos - Pollo Campero</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #fff8e1, #ffffff);
      margin: 0;
      padding: 0;
      color: #4e342e;
    }
    header {
      background-color: #ff9800;
      color: white;
      padding: 20px 0;
      text-align: center;
    }
    nav {
      background-color: #f57c00;
      text-align: center;
      padding: 10px 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    main {
      padding: 30px;
      max-width: 900px;
      margin: auto;
    }
    form {
      background-color: #fff3e0;
      padding: 20px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      background-color: #ff9800;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ef6c00;
    }
    footer {
      background-color: #ff9800;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contáctanos</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="menu.html">Menú</a>
    <a href="proyectos.html">Responsabilidad Social</a>
    <a href="contacto.html">Contáctanos</a>
  </nav>

  <main>
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    &copy; 2025 Pollo Campero Guatemala. Todos los derechos reservados.
  </footer>
</body>
</html>
